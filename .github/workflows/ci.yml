name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress CI runs when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use setup-go's compiler, not a module/toolchain-triggered automatic replacement.
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Without this, setup-go keeps the runner image's PREINSTALLED Go when it
          # satisfies the "1.26" range, instead of fetching the newest patch. That
          # silently pins CI to a stale patch release — which govulncheck then reports
          # as stdlib vulnerabilities (GO-2026-6218/6088/5942/4970, all fixed in
          # 1.26.5/1.26.6, while the image still shipped 1.26.4). Tracking the latest
          # patch is the point of a vulnerability gate, so always check.
          check-latest: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check Go toolchain coordination
        run: just toolchain-check

      - name: Verify Go module is tidy
        run: just tidy-check

      - name: Verify CLI reference docs are up to date
        run: just docs-check

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ The following files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      # Match the container's linter release line (just toolchain-check).
      # The downloaded binary must also be built with Go >= go.mod's minimum;
      # the release gate verifies that for the actual installed linter.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

      - name: Cache govulncheck
        id: cache-govulncheck
        uses: actions/cache@v6
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ runner.os }}-${{ steps.go.outputs.go-version }}

      - name: Install govulncheck
        if: steps.cache-govulncheck.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # -scan package, not the default symbol scan: the symbol-level SSA
      # call-graph panics on our generic code ("ForEachElement called on type
      # containing *types.TypeParam") — an x/tools SSA type-param substitution
      # bug (golang/go#66783), not a vulnerability. Package-level scan never
      # builds SSA so it can't hit the panic, and still fails CI on any vuln in
      # an imported package (it caught the x/net CVEs the panic was masking).
      - name: Run govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" -scan package ./...

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -p 4 -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: go
          name: go-coverage
          fail_ci_if_error: false

  planning-lint:
    name: Planning Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate planning tree
        uses: ./actions/lint
        with:
          args: "--no-color"

